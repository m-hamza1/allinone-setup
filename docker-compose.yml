services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: allin
      POSTGRES_USER: allin
      POSTGRES_PASSWORD: allin
    volumes:
      - allin_postgres:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - allin_redis:/data

volumes:
  allin_postgres:
  allin_redis:
